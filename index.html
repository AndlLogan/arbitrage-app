    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let state = {
            lastActiveDate: null,
            currentCircle: 1,
            circleInProgress: false,
            isCurrentCircleTransferred: false,
            pendingTransfer: null,
            lastFinishedCircle: null,
            dayClosed: false,
            carryProfit: 0,
            currentAmount: 10000000
        };

        const TAX_PCT = 13;

        function round2(n) {
            return Math.round(n * 100) / 100;
        }

        // --- Форматирование суммы с пробелами ---
        function formatAmountInput(el) {
            let digits = el.value.replace(/\D/g, '');
            if (digits === '') {
                el.value = '';
                return;
            }
            digits = digits.replace(/^0+/, '') || '0';
            el.value = Number(digits).toLocaleString('ru-RU').replace(/,/g, ' ');
        }

        // --- Парсинг суммы: убираем пробелы и получаем число ---
        function parseAmount(str) {
            if (typeof str === 'number') return str;
            const cleaned = String(str).replace(/\s/g, '').replace(',', '.');
            const n = parseFloat(cleaned);
            return isNaN(n) ? 0 : n;
        }

        // --- Форматирование числа в строку с пробелами ---
        function formatNumber(n) {
            return Number(n).toLocaleString('ru-RU').replace(/,/g, ' ');
        }

        // --- Утилиты ---
        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function dateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function formatDateTime(dateString) {
            if (!dateString) return '—';
            return new Date(dateString).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        function formatDateOnly(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function formatDateForFile(dateString) {
            return new Date(dateString).toLocaleDateString('ru-RU').replace(/\./g, '-');
        }
        function calculateDuration(startStr, endStr) {
            if (!startStr || !endStr) return '—';
            const diffMs = new Date(endStr) - new Date(startStr);
            if (diffMs < 0) return 'Ошибка времени';
            const h = Math.floor(diffMs / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);
            return h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
        }
        function nowLocalISO() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return (new Date(now - offset)).toISOString().slice(0, 16);
        }

        function saveState() { localStorage.setItem('arbitrageState', JSON.stringify(state)); }
        function loadState() {
            const saved = localStorage.getItem('arbitrageState');
            if (saved) { try { state = JSON.parse(saved); } catch(e) {} }
        }
        function getHistory() { return JSON.parse(localStorage.getItem('arbitrageHistory') || '[]'); }
        function saveHistory(h) { localStorage.setItem('arbitrageHistory', JSON.stringify(h)); }

        function getPayouts() { return JSON.parse(localStorage.getItem('arbitragePayouts') || '{}'); }
        function savePayouts(p) { localStorage.setItem('arbitragePayouts', JSON.stringify(p)); }

        // --- Инициализация ---
        function init() {
            loadState();
            const today = todayStr();

            if (state.lastActiveDate && state.lastActiveDate !== today) {
                handleNewDay();
            }
            const isSameDay = state.lastActiveDate === today;

            const history = getHistory().filter(h => h.date === today);
            const hasActiveCycle = isSameDay && (
                state.circleInProgress ||
                state.pendingTransfer ||
                (state.currentCircle > 1 && !getPayouts()[today]) ||
                history.length > 0
            );

            state.lastActiveDate = today;
            saveState();

            if (state.pendingTransfer) showTransferNotice(state.pendingTransfer);
            updateUI();
            renderTodayCircles();

            if (hasActiveCycle && !getPayouts()[today]) {
                setTimeout(() => {
                    askContinueOrNew();
                }, 400);
            }
        }

        function askContinueOrNew() {
            const msg = 'У вас есть незавершённый цикл за сегодня. Продолжить работу с текущего цикла или начать новый?';

            if (typeof tg.showPopup === 'function') {
                tg.showPopup({
                    title: 'Продолжить работу?',
                    message: msg,
                    buttons: [
                        { id: 'continue', type: 'default', text: 'Продолжить' },
                        { id: 'new', type: 'destructive', text: 'Начать новый' }
                    ]
                }, (buttonId) => {
                    if (buttonId === 'new') {
                        startFreshCycle();
                    }
                });
            } else {
                const cont = window.confirm(msg + '\n\nOK — продолжить.\nОтмена — начать новый цикл.');
                if (!cont) {
                    startFreshCycle();
                }
            }
        }

        function startFreshCycle() {
            state.circleInProgress = false;
            state.currentCircle = 1;
            state.carryProfit = 0;
            state.pendingTransfer = null;
            state.lastFinishedCircle = null;
            state.isCurrentCircleTransferred = false;
            saveState();

            document.getElementById('results').innerHTML = '';
            document.getElementById('topCircles').innerHTML = '';
            document.getElementById('topDivider').style.display = 'none';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
            document.getElementById('nextSection').style.display = 'none';
            document.getElementById('transferNotice').style.display = 'none';

            updateUI();
            renderTodayCircles();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function handleNewDay() {
            if (state.pendingTransfer) {
                state.currentCircle = state.pendingTransfer.circleNumber;
            } else {
                state.currentCircle = 1;
            }
            state.circleInProgress = false;
            state.lastFinishedCircle = null;
            state.dayClosed = false;
        }

        function showTransferNotice(pt) {
            document.getElementById('transferCircleNum').innerText = pt.circleNumber;
            document.getElementById('transferDate').innerText = formatDateOnly(pt.fromDate);
            document.getElementById('transferNotice').style.display = 'block';
        }

        function updateUI() {
            const startSection = document.getElementById('startSection');
            const formSection = document.getElementById('formSection');
            const nextSection = document.getElementById('nextSection');

            document.getElementById('currentCircleNum').innerText = state.currentCircle;

            if (state.circleInProgress) {
                startSection.style.display = 'none';
                formSection.style.display = 'block';
                nextSection.style.display = 'none';
            } else {
                startSection.style.display = 'block';
                formSection.style.display = 'none';
                nextSection.style.display = 'none';
                document.getElementById('startBtn').innerText = `▶️ Начать ${state.currentCircle}-й круг`;
            }
        }

        // --- Старт круга ---
        function startCircle() {
            state.circleInProgress = true;
            saveState();

            const startInput = document.getElementById('startTime');
            const endInput = document.getElementById('endTime');
            const amountInput = document.getElementById('amount');

            if (state.pendingTransfer) {
                const pt = state.pendingTransfer;
                amountInput.value = formatNumber(pt.amount);
                document.getElementById('buyPrice').value = pt.buyPrice;
                document.getElementById('sellPrice').value = pt.sellPrice;
                document.getElementById('exchangeComm').value = pt.exchangeComm;
                document.getElementById('exchangerComm').value = pt.exchangerComm;
                document.getElementById('bankComm').value = pt.bankComm;
                document.getElementById('taxToggle').checked = pt.taxEnabled;
                startInput.value = pt.startTime;
                state.isCurrentCircleTransferred = true;
                state.currentAmount = pt.amount;
                document.getElementById('transferNotice').style.display = 'none';
                state.pendingTransfer = null;
                saveState();
                tg.showAlert(`Продолжаем круг №${state.currentCircle}. Время начала сохранено со вчера.`);
            } else {
                const deposit = parseAmount(amountInput.value) || state.currentAmount || 0;
                state.currentAmount = deposit;

                let newAmount = deposit;
                if (state.carryProfit && state.carryProfit > 0) {
                    newAmount = deposit + state.carryProfit;
                }

                newAmount = round2(newAmount);
                amountInput.value = formatNumber(newAmount);

                state.carryProfit = 0;
                startInput.value = nowLocalISO();
                state.isCurrentCircleTransferred = false;

                saveState();
            }
            endInput.value = '';
            tg.HapticFeedback.impactOccurred('light');
            updateUI();
        }

        // --- Завершение круга ---
        function finishCircle() {
            document.getElementById('endTime').value = nowLocalISO();

            const amount = parseAmount(document.getElementById('amount').value);
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const exchangeCommPct = parseFloat(document.getElementById('exchangeComm').value) / 100;
            const exchangerCommPct = parseFloat(document.getElementById('exchangerComm').value) / 100;
            const bankCommRub = parseFloat(document.getElementById('bankComm').value);
            const circleNumber = state.currentCircle;
            const taxEnabled = document.getElementById('taxToggle').checked;
            const startTimeVal = document.getElementById('startTime').value;
            const endTimeVal = document.getElementById('endTime').value;
            const wasTransferred = state.isCurrentCircleTransferred;

            if (isNaN(amount) || isNaN(buyPrice) || isNaN(sellPrice) || isNaN(bankCommRub)) {
                tg.showAlert("Заполните все поля корректными числами!");
                return;
            }
            if (!startTimeVal) {
                tg.showAlert("Укажите время начала круга.");
                return;
            }

            const spreadPct = (sellPrice - buyPrice) / buyPrice;
            const grossProfit = round2(amount * spreadPct);
            const exchangeComm = round2(amount * exchangeCommPct);
            const exchangerComm = round2((amount - exchangeComm) * exchangerCommPct);
            const totalExpenses = round2(exchangeComm + exchangerComm + bankCommRub);
            const preTaxProfit = round2(grossProfit - totalExpenses);
            const tax = taxEnabled ? round2(preTaxProfit * (TAX_PCT / 100)) : 0;
            const netProfit = round2(preTaxProfit - tax);
            const durationStr = calculateDuration(startTimeVal, endTimeVal);

            state.currentAmount = amount;

            const history = getHistory();
            history.push({
                date: state.lastActiveDate,
                circle: circleNumber,
                start: startTimeVal,
                end: endTimeVal,
                duration: durationStr,
                amount: amount,
                netProfit: netProfit,
                transferred: wasTransferred,
                tax: tax,
                taxPct: taxEnabled ? TAX_PCT : 0,
                grossProfit: grossProfit,
                expenses: totalExpenses,
                exchangeComm: exchangeComm,
                exchangerComm: exchangerComm,
                bankCommRub: bankCommRub,
                teamPayout: 0
            });
            saveHistory(history);

            state.circleInProgress = false;
            state.lastFinishedCircle = circleNumber;
            let alertMsg = '';
            if (wasTransferred) {
                state.currentCircle = 1;
                state.isCurrentCircleTransferred = false;
                alertMsg = `Перенесённый круг №${circleNumber} завершён. Следующий круг — №1 (новый день).`;
            } else if (state.currentCircle >= 4) {
                state.currentCircle = 1;
                alertMsg = "Все 4 круга завершены! Следующий круг начнётся с 1-го.";
            } else {
                state.currentCircle += 1;
            }
            saveState();
            if (alertMsg) tg.showAlert(alertMsg);

            document.getElementById('nextBtn').innerText = `▶️ Начать ${state.currentCircle}-й круг`;
            document.getElementById('nextSection').style.display = 'block';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'none';

            renderTodayCircles();

            tg.HapticFeedback.notificationOccurred('success');

            setTimeout(() => {
                askCarryProfit(netProfit);
            }, 300);
        }

        function askCarryProfit(netProfit) {
            const msg = `Перенести прибыль круга (${formatNumber(netProfit)} ₽) на следующий круг?`;

            if (typeof tg.showPopup === 'function') {
                tg.showPopup({
                    title: 'Перенос прибыли',
                    message: msg,
                    buttons: [
                        { id: 'yes', type: 'default', text: 'Да' },
                        { id: 'no',  type: 'destructive', text: 'Нет' }
                    ]
                }, (buttonId) => {
                    state.carryProfit = (buttonId === 'yes') ? netProfit : 0;
                    saveState();
                });
            } else {
                const yes = window.confirm(msg);
                state.carryProfit = yes ? netProfit : 0;
                saveState();
            }
        }

        // --- Перенос круга ---
        function transferCircle() {
            const amount = parseAmount(document.getElementById('amount').value);
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const exchangeComm = parseFloat(document.getElementById('exchangeComm').value);
            const exchangerComm = parseFloat(document.getElementById('exchangerComm').value);
            const bankComm = parseFloat(document.getElementById('bankComm').value);
            const taxEnabled = document.getElementById('taxToggle').checked;
            const startTime = document.getElementById('startTime').value || nowLocalISO();

            state.pendingTransfer = {
                startTime, circleNumber: state.currentCircle,
                fromDate: state.lastActiveDate,
                amount, buyPrice, sellPrice,
                exchangeComm, exchangerComm, bankComm,
                taxEnabled
            };
            state.circleInProgress = false;
            saveState();

            tg.showAlert(`Круг №${state.currentCircle} перенесён на завтра.`);
            tg.HapticFeedback.notificationOccurred('warning');

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
            updateUI();
        }

        function resetForNextCircle() {
            document.getElementById('nextSection').style.display = 'none';
            startCircle();
        }

        function backToMain() {
            document.getElementById('results').innerHTML = '';
            updateUI();
        }

        // ============================================================
        // 📋 ВЕРХНИЙ БЛОК
        // ============================================================
        function renderTodayCircles() {
            const topBox = document.getElementById('topCircles');
            const topDivider = document.getElementById('topDivider');

            const payouts = getPayouts();
            const dayClosed = !!payouts[state.lastActiveDate];
            if (dayClosed) {
                topBox.innerHTML = '';
                topDivider.style.display = 'none';
                return;
            }

            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            if (history.length === 0) {
                topBox.innerHTML = '';
                topDivider.style.display = 'none';
                return;
            }

            topDivider.style.display = 'block';

            const sorted = history.slice().sort((a, b) => a.circle - b.circle);

            let totalNet = 0;
            sorted.forEach(h => { totalNet += h.netProfit || 0; });
            totalNet = round2(totalNet);

            let html = `
                <div class="stats-mini">
                    <div>
                        <div class="sm-label">📅 Кругов: <b>${sorted.length}</b> · Прибыль до выплат</div>
                    </div>
                    <div class="sm-value">${formatNumber(totalNet)} ₽</div>
                </div>
            `;

            sorted.forEach((h) => {
                const mark = h.transferred ? ' ⏭' : '';
                const isLast = h.circle === state.lastFinishedCircle;
                const openAttr = isLast ? 'open' : '';

                html += `
                    <details class="circle-item" ${openAttr}>
                        <summary class="circle-summary">
                            <div class="cs-left">
                                <span class="cs-arrow">▶</span>
                                <span class="cs-title">Круг №${h.circle}${mark}</span>
                                <span class="cs-amount">${formatNumber(h.amount || 0)} ₽</span>
                            </div>
                            <span class="cs-profit">${formatNumber(h.netProfit || 0)} ₽</span>
                        </summary>
                        <div class="circle-details">
                            <div class="time-row"><span>Начало:</span> <span>${formatDateTime(h.start)}</span></div>
                            <div class="time-row"><span>Конец:</span> <span>${formatDateTime(h.end)}</span></div>
                            <div class="time-row" style="margin-bottom:8px;"><span>Длительность:</span> <span>${h.duration}</span></div>

                            <div class="result-row"><span>Сумма оборота:</span> <span>${formatNumber(h.amount || 0)} ₽</span></div>
                            <div class="result-row"><span>Валовая прибыль:</span> <span>${formatNumber(h.grossProfit || 0)} ₽</span></div>

                            <div style="margin-top:6px; font-size:13px; color:var(--hint-color);">Расходы:</div>
                            <div class="result-row" style="font-size:14px;"><span>Биржа:</span> <span>-${formatNumber(h.exchangeComm || 0)} ₽</span></div>
                            <div class="result-row" style="font-size:14px;"><span>Обменник:</span> <span>-${formatNumber(h.exchangerComm || 0)} ₽</span></div>
                            <div class="result-row" style="font-size:14px;"><span>Банк:</span> <span>-${formatNumber(h.bankCommRub || 0)} ₽</span></div>
                            <div class="result-row" style="font-size:14px; font-weight:bold;"><span>Итого расходов:</span> <span style="color:var(--danger-color);">-${formatNumber(h.expenses || 0)} ₽</span></div>

                            <div class="result-row" style="margin-top:6px;"><span>Налог 13%:</span> <span style="color:var(--danger-color);">-${formatNumber(h.tax || 0)} ₽</span></div>

                            <div class="result-row" style="font-size:16px; margin-top:10px; border-top:2px solid var(--button-color); padding-top:8px;">
                                <span>ЧИСТАЯ ПРИБЫЛЬ КРУГА:</span>
                                <span class="highlight">${formatNumber(h.netProfit || 0)} ₽</span>
                            </div>
                        </div>
                    </details>
                `;
            });

            topBox.innerHTML = html;
        }

        // ============================================================
        // 🏁 ЗАВЕРШИТЬ ДЕНЬ
        // ============================================================
        function finishDay() {
            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            if (history.length === 0) {
                tg.showAlert("За сегодня нет завершённых кругов.");
                return;
            }

            const alreadyClosed = getPayouts()[state.lastActiveDate];
            if (alreadyClosed) {
                showDayFinalStats(alreadyClosed.percent, alreadyClosed.amount);
                return;
            }

            let totalNet = 0;
            history.forEach(h => { totalNet += h.netProfit || 0; });
            totalNet = round2(totalNet);

            const defaultPct = 15;

            let html = `
                <div class="payout-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">🏁 Завершение дня</span>
                    </div>
                    <div class="payout-total">
                        <span class="pt-label">Общая чистая прибыль за день</span>
                        <span class="pt-value">${formatNumber(totalNet)} ₽</span>
                    </div>

                    <div class="payout-row">
                        <span>👥 Процент команде:</span>
                        <input type="number" id="payoutPctInput" value="${defaultPct}" step="0.1" min="0" max="100" oninput="updatePayoutPreview(${totalNet})">
                    </div>

                    <div class="payout-split" id="payoutPreview"></div>

                    <button class="btn-primary" onclick="confirmFinishDay(${totalNet})">✅ Подтвердить и закрыть день</button>
                    <button class="btn-secondary" onclick="backToMain()">← Отмена</button>
                </div>
            `;

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            updatePayoutPreview(totalNet);
        }

        function updatePayoutPreview(totalNet) {
            const pct = parseFloat(document.getElementById('payoutPctInput').value) || 0;
            const teamAmount = round2(totalNet * (pct / 100));
            const remainder = round2(totalNet - teamAmount);

            document.getElementById('payoutPreview').innerHTML = `
                <div class="result-row">
                    <span>Команде (${pct}%):</span>
                    <span style="color:var(--danger-color); font-weight:bold;">−${formatNumber(teamAmount)} ₽</span>
                </div>
                <div class="result-row" style="border-top:1px dashed var(--hint-color); padding-top:6px; margin-top:6px;">
                    <span>Остаётся нам:</span>
                    <span class="highlight">${formatNumber(remainder)} ₽</span>
                </div>
            `;
        }

        function confirmFinishDay(totalNet) {
            const pct = parseFloat(document.getElementById('payoutPctInput').value);
            if (isNaN(pct) || pct < 0 || pct > 100) {
                tg.showAlert("Введите корректный процент (0–100).");
                return;
            }
            const teamAmount = round2(totalNet * (pct / 100));

            const payouts = getPayouts();
            payouts[state.lastActiveDate] = {
                percent: pct,
                amount: teamAmount,
                baseProfit: totalNet,
                closedAt: new Date().toISOString()
            };
            savePayouts(payouts);

            const history = getHistory();
            const dayCircles = history.filter(h => h.date === state.lastActiveDate);
            const totalDayNet = dayCircles.reduce((s, h) => s + (h.netProfit || 0), 0);
            if (totalDayNet > 0) {
                history.forEach(h => {
                    if (h.date === state.lastActiveDate) {
                        h.teamPayout = round2((h.netProfit / totalDayNet) * teamAmount);
                    }
                });
                saveHistory(history);
            }

            state.dayClosed = true;
            state.circleInProgress = false;
            state.currentCircle = 1;
            state.isCurrentCircleTransferred = false;
            state.pendingTransfer = null;
            state.lastFinishedCircle = null;
            state.carryProfit = 0;
            saveState();

            document.getElementById('topCircles').innerHTML = '';
            document.getElementById('topDivider').style.display = 'none';

            showDayFinalStats(pct, teamAmount);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function showDayFinalStats(pct, teamAmount) {
            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            const today = formatDateOnly(state.lastActiveDate);

            let totalNet = 0, totalTurnover = 0, totalTax = 0, totalExpenses = 0, totalGross = 0;
            history.forEach(h => {
                totalNet += h.netProfit || 0;
                totalTurnover += h.amount || 0;
                totalTax += h.tax || 0;
                totalExpenses += h.expenses || 0;
                totalGross += h.grossProfit || 0;
            });

            totalNet = round2(totalNet);
            totalTurnover = round2(totalTurnover);
            totalTax = round2(totalTax);
            totalExpenses = round2(totalExpenses);
            totalGross = round2(totalGross);

            const finalNet = round2(totalNet - teamAmount);

            let html = `
                <div class="result-card" style="border:2px solid var(--success-color);">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">✅ День закрыт — ${today}</span>
                    </div>

                    <div class="result-row"><span>Кругов завершено:</span> <b>${history.length}</b></div>
                    <div class="result-row"><span>Общий оборот:</span> <b>${formatNumber(totalTurnover)} ₽</b></div>
                    <div class="result-row"><span>Валовая прибыль:</span> <b>${formatNumber(totalGross)} ₽</b></div>
                    <div class="result-row"><span>Расходы (всего):</span> <b style="color:var(--danger-color);">−${formatNumber(totalExpenses)} ₽</b></div>
                    <div class="result-row"><span>Налог (всего):</span> <b style="color:var(--danger-color);">−${formatNumber(totalTax)} ₽</b></div>
                    <div class="result-row" style="border-top:1px dashed var(--hint-color); padding-top:6px; margin-top:6px;">
                        <span>Прибыль до выплат команде:</span>
                        <b>${formatNumber(totalNet)} ₽</b>
                    </div>
                    <div class="result-row">
                        <span>👥 Команде (${pct}%):</span>
                        <b style="color:var(--danger-color);">−${formatNumber(teamAmount)} ₽</b>
                    </div>
                    <div class="result-row" style="font-size:18px; border-top:2px solid var(--success-color); padding-top:10px; margin-top:10px;">
                        <span>💰 ЧИСТАЯ ПРИБЫЛЬ ДНЯ:</span>
                        <span class="highlight">${formatNumber(finalNet)} ₽</span>
                    </div>

                    <button class="btn-success" onclick="startNewDayAfterClose()">▶️ Начать новый день</button>
                    <button class="btn-secondary" onclick="backToMain()">← На главную</button>
                </div>
            `;

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function startNewDayAfterClose() {
            state.circleInProgress = false;
            state.currentCircle = 1;
            state.dayClosed = false;
            state.lastFinishedCircle = null;
            state.carryProfit = 0;
            saveState();

            document.getElementById('results').innerHTML = '';
            document.getElementById('topCircles').innerHTML = '';
            document.getElementById('topDivider').style.display = 'none';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
            document.getElementById('nextSection').style.display = 'none';
            document.getElementById('transferNotice').style.display = 'none';

            updateUI();
            renderTodayCircles();
        }

        // ============================================================
        // 📊 ВЫБОР ПЕРИОДА И ОТЧЁТ
        // ============================================================
        function showPeriodSelector(defaultFrom, defaultTo) {
            const today = todayStr();
            const from = defaultFrom || today;
            const to = defaultTo || today;

            let html = `
                <div class="result-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">📊 Выгрузка отчёта</span>
                    </div>

                    <div style="font-size:13px; color:var(--hint-color); margin-bottom:6px;">Быстрый выбор:</div>
                    <div class="quick-periods">
                        <button class="btn-secondary btn-small" onclick="setPeriod('today')">Сегодня</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('yesterday')">Вчера</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('7d')">7 дней</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('30d')">30 дней</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('month')">Этот месяц</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('all')">Всё время</button>
                    </div>

                    <div class="section-title">Или выберите вручную</div>
                    <div class="grid-2" style="align-items: end;">
                        <div class="input-group" style="text-align:center;">
                            <label style="text-align:center;">Дата с</label>
                            <input type="date" id="periodFrom" value="${from}">
                        </div>
                        <div class="input-group" style="text-align:center;">
                            <label style="text-align:center;">Дата по</label>
                            <input type="date" id="periodTo" value="${to}">
                        </div>
                    </div>

                    <button class="btn-primary" onclick="buildAndShowReport()">📊 Построить отчёт</button>
                    <button class="btn-secondary" onclick="backToMain()">← Назад</button>
                </div>
            `;
            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function setPeriod(preset) {
            const now = new Date();
            const today = dateStr(now);
            let from = today, to = today;

            switch (preset) {
                case 'today': from = today; to = today; break;
                case 'yesterday': {
                    const y = new Date(now); y.setDate(y.getDate() - 1);
                    from = dateStr(y); to = dateStr(y); break;
                }
                case '7d': {
                    const f = new Date(now); f.setDate(f.getDate() - 6);
                    from = dateStr(f); to = today; break;
                }
                case '30d': {
                    const f = new Date(now); f.setDate(f.getDate() - 29);
                    from = dateStr(f); to = today; break;
                }
                case 'month': {
                    const f = new Date(now.getFullYear(), now.getMonth(), 1);
                    from = dateStr(f); to = today; break;
                }
                case 'all': {
                    const history = getHistory();
                    if (history.length === 0) { from = today; to = today; }
                    else {
                        const dates = history.map(h => h.date).sort();
                        from = dates[0]; to = today;
                    }
                    break;
                }
            }

            document.getElementById('periodFrom').value = from;
            document.getElementById('periodTo').value = to;
            buildAndShowReport();
        }

        function buildReport(fromDate, toDate) {
            const history = getHistory().filter(h => h.date >= fromDate && h.date <= toDate);
            const payouts = getPayouts();

            const fromFmt = formatDateOnly(fromDate);
            const toFmt = formatDateOnly(toDate);
            const periodLabel = fromDate === toDate ? fromFmt : `${fromFmt} — ${toFmt}`;

            if (history.length === 0) {
                return `📅 ОТЧЁТ ЗА ПЕРИОД\n${periodLabel}\n\nНет завершённых кругов за выбранный период.`;
            }

            const byDay = {};
            history.forEach(h => {
                if (!byDay[h.date]) byDay[h.date] = [];
                byDay[h.date].push(h);
            });

            const sortedDays = Object.keys(byDay).sort();
            let lines = [`📅 ОТЧЁТ ЗА ПЕРИОД`, `${periodLabel}`, '━━━━━━━━━━━━━━━━━━━━', ''];

            let grandTotal = { circles: 0, net: 0, team: 0, amount: 0, final: 0 };

            sortedDays.forEach(day => {
                const dayEntries = byDay[day].sort((a,b) => a.circle - b.circle);
                const dayTotal = { circles: 0, net: 0, amount: 0 };

                lines.push(`📆 ${formatDateOnly(day)}`);

                dayEntries.forEach(h => {
                    const mark = h.transferred ? ' ⏭' : '';
                    lines.push(`  🔄 Круг №${h.circle}${mark}`);
                    lines.push(`     ${formatDateTime(h.start)} — ${formatDateTime(h.end)} (${h.duration})`);
                    lines.push(`     Сумма: ${formatNumber(h.amount || 0)} ₽`);
                    lines.push(`     Чистая прибыль: ${formatNumber(h.netProfit || 0)} ₽`);

                    dayTotal.circles++;
                    dayTotal.net += h.netProfit || 0;
                    dayTotal.amount += h.amount || 0;
                });

                const dayPayout = payouts[day];
                const dayFinal = dayPayout ? round2(dayTotal.net - dayPayout.amount) : round2(dayTotal.net);

                lines.push(`  ─── Итого за день: ${formatNumber(dayTotal.net)} ₽ (${dayTotal.circles} кр.)`);
                if (dayPayout) {
                    lines.push(`      👥 Команде (${dayPayout.percent}%): −${formatNumber(dayPayout.amount)} ₽`);
                    lines.push(`      💰 ЧИСТАЯ ПРИБЫЛЬ ДНЯ: ${formatNumber(dayFinal)} ₽`);
                } else {
                    lines.push(`      ⚠️ День не закрыт (выплата команде не применялась)`);
                }
                lines.push('');

                grandTotal.circles += dayTotal.circles;
                grandTotal.net += dayTotal.net;
                grandTotal.team += dayPayout ? dayPayout.amount : 0;
                grandTotal.amount += dayTotal.amount;
                grandTotal.final += dayFinal;
            });

            lines.push('━━━━━━━━━━━━━━━━━━━━');
            lines.push(`📊 ИТОГО ЗА ПЕРИОД:`);
            lines.push(`Дней в отчёте: ${sortedDays.length}`);
            lines.push(`Кругов завершено: ${grandTotal.circles}`);
            lines.push(`Общий оборот: ${formatNumber(grandTotal.amount)} ₽`);
            lines.push(`Прибыль до выплат: ${formatNumber(grandTotal.net)} ₽`);
            lines.push(`Выплаты команде: −${formatNumber(grandTotal.team)} ₽`);
            lines.push(`💰 ЧИСТАЯ ПРИБЫЛЬ: ${formatNumber(grandTotal.final)} ₽`);

            return lines.join('\n');
        }

        function buildAndShowReport() {
            const fromDate = document.getElementById('periodFrom').value;
            const toDate = document.getElementById('periodTo').value;

            if (!fromDate || !toDate) {
                tg.showAlert("Укажите обе даты периода.");
                return;
            }
            if (fromDate > toDate) {
                tg.showAlert("Дата «с» не может быть позже даты «по».");
                return;
            }

            const reportText = buildReport(fromDate, toDate);
            window.__lastReport = reportText;
            window.__reportPeriod = { from: fromDate, to: toDate };

            const safeText = reportText.replace(/</g, '&lt;');
            let html = `
                <div class="result-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">📅 Отчёт за период</span>
                    </div>
                    <div class="report-text">${safeText}</div>
                    <button class="btn-primary" onclick="downloadReport()">📥 Скачать TXT</button>
                    <button class="btn-secondary" onclick="copyReport()">📋 Скопировать</button>
                    <button class="btn-success" onclick="sendReportToChat()">📤 Отправить в чат</button>
                    <button class="btn-secondary" onclick="showPeriodSelector('${fromDate}', '${toDate}')">← Изменить период</button>
                    <button class="btn-secondary" onclick="backToMain()">🏠 На главную</button>
                </div>
            `;
            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function downloadReport() {
            const text = window.__lastReport || '';
            const period = window.__reportPeriod || { from: todayStr(), to: todayStr() };
            const nameFrom = formatDateForFile(period.from);
            const nameTo = formatDateForFile(period.to);
            const filename = period.from === period.to
                ? `arbitrage_${nameFrom}.txt`
                : `arbitrage_${nameFrom}_${nameTo}.txt`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function copyReport() {
            const text = window.__lastReport || '';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    tg.showAlert("Отчёт скопирован ✅");
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                tg.showAlert("Отчёт скопирован ✅");
            }
        }

        function sendReportToChat() {
            const text = window.__lastReport || '';
            const period = window.__reportPeriod || { from: todayStr(), to: todayStr() };
            try {
                tg.sendData(JSON.stringify({
                    type: 'period_report',
                    from: period.from,
                    to: period.to,
                    text: text
                }));
                tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                tg.showAlert("Отправка доступна только внутри Telegram-бота.");
            }
        }

        // --- Запуск ---
        init();
    </script>
</body>
</html>
