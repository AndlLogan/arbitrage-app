<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Калькулятор арбитража</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 14px; font-size: 14px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 17px; text-align: center; margin-bottom: 12px; }

        .badge {
            display: inline-block; padding: 4px 10px;
            border-radius: 12px; font-size: 12px;
            font-weight: bold; margin-bottom: 10px;
        }
        .badge-circle { background: var(--button-color); color: var(--button-text-color); }
        .badge-transfer { background: var(--warning-color); color: white; }
        .badge-day { background: var(--success-color); color: white; }

        .section-title {
            font-size: 11px; color: var(--hint-color);
            margin: 10px 0 4px 0;
            border-bottom: 1px solid var(--hint-color);
            padding-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

        .input-group { margin-bottom: 6px; }
        label {
            display: block;
            font-size: 11px;
            margin-bottom: 2px;
            color: var(--hint-color);
        }

        input[type="number"], input[type="datetime-local"], input[type="date"] {
            width: 100%;
            padding: 7px 8px;
            border-radius: 6px;
            border: 1px solid var(--hint-color);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            height: 34px;
        }
        input:focus { border-color: var(--button-color); }

        .checkbox-group {
            display: flex; align-items: center;
            margin: 8px 0;
            background-color: var(--secondary-bg);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .checkbox-group input {
            width: 18px; height: 18px;
            margin-right: 8px;
            accent-color: var(--button-color);
        }
        .checkbox-group label { margin: 0; font-size: 13px; color: var(--text-color); }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: var(--button-color); color: var(--button-text-color); }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-warning { background-color: var(--warning-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-secondary { background-color: var(--secondary-bg); color: var(--text-color); border: 1px solid var(--hint-color); }
        .btn-small { font-size: 12px; padding: 8px; margin-top: 4px; }
        button:active { opacity: 0.85; }

        .quick-periods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .result-card { background-color: var(--secondary-bg); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .result-row:last-child { margin-bottom: 0; }
        .highlight { color: var(--success-color); font-weight: bold; }
        .time-row { font-size: 11px; color: var(--hint-color); margin-bottom: 3px; display: flex; justify-content: space-between; }

        .notice {
            background: var(--warning-color); color: white;
            padding: 8px 10px; border-radius: 8px;
            font-size: 12px; margin-bottom: 10px;
        }
        .circle-status {
            text-align: center; font-size: 15px; font-weight: bold;
            padding: 10px; background: var(--secondary-bg);
            border-radius: 8px; margin-bottom: 8px;
        }
        .report-text {
            background: var(--bg-color);
            padding: 12px; border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        .circle-item {
            background: var(--secondary-bg);
            border-radius: 6px;
            margin-bottom: 4px;
            overflow: hidden;
        }

        .circle-summary {
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            line-height: 1.2;
        }
        .circle-summary:active { opacity: 0.7; }

        .cs-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .cs-arrow {
            color: var(--hint-color);
            font-size: 10px;
            transition: transform 0.15s;
            flex-shrink: 0;
            width: 10px;
            text-align: center;
        }
        details[open] .cs-arrow { transform: rotate(90deg); }

        .cs-title {
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
        }
        .cs-amount {
            font-size: 10px;
            color: var(--hint-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cs-profit {
            color: var(--success-color);
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .circle-details {
            padding: 10px;
            border-top: 1px solid var(--hint-color);
            background: var(--bg-color);
        }

        #topCircles { margin-bottom: 10px; }

        .divider {
            height: 1px;
            background: var(--hint-color);
            opacity: 0.3;
            margin: 12px 0;
        }

        .stats-mini {
            background: var(--secondary-bg);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--button-color);
            font-size: 11px;
            gap: 8px;
        }
        .stats-mini .sm-label {
            color: var(--hint-color);
            font-size: 10px;
        }
        .stats-mini .sm-value {
            font-weight: bold;
            font-size: 12px;
            color: var(--success-color);
        }

        .payout-card {
            background: var(--secondary-bg);
            border: 2px solid var(--warning-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .payout-total {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--hint-color);
        }
        .payout-total .pt-label { color: var(--hint-color); font-size: 11px; }
        .payout-total .pt-value {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: var(--success-color);
            margin-top: 4px;
        }
        .payout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            gap: 8px;
        }
        .payout-row input {
            width: 70px;
            text-align: right;
        }
        .payout-split {
            background: var(--bg-color);
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Калькулятор арбитража</h1>

        <div id="transferNotice" class="notice" style="display:none;">
            🔄 Перенесённый <b>круг №<span id="transferCircleNum"></span></b> с <span id="transferDate"></span>. Завершите его сегодня.
        </div>

        <div id="topCircles"></div>

        <div class="divider" id="topDivider"></div>

        <div id="circleStatus" class="circle-status">
            Текущий круг: <span id="currentCircleNum">1</span>
        </div>

        <div id="startSection">
            <button class="btn-success" onclick="startCircle()" id="startBtn">▶️ Начать 1-й круг</button>
            <button class="btn-secondary" onclick="showPeriodSelector()">📊 Выгрузить отчёт</button>
            <button class="btn-danger" onclick="finishDay()">🏁 Завершить день</button>
        </div>

        <div id="formSection" style="display:none;">
            <div class="section-title">Сумма и курсы</div>
            <div class="grid-3">
                <div class="input-group">
                    <label>Сумма (₽)</label>
                    <input type="number" id="amount" value="10000000">
                </div>
                <div class="input-group">
                    <label>Покупка</label>
                    <input type="number" step="0.01" id="buyPrice" value="84.65">
                </div>
                <div class="input-group">
                    <label>Продажа</label>
                    <input type="number" step="0.01" id="sellPrice" value="87.98">
                </div>
            </div>

            <div class="section-title">Время</div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Начало</label>
                    <input type="datetime-local" id="startTime">
                </div>
                <div class="input-group">
                    <label>Окончание</label>
                    <input type="datetime-local" id="endTime">
                </div>
            </div>

            <div class="section-title">Комиссии и налог</div>
            <div class="grid-3">
                <div class="input-group">
                    <label>Биржа (%)</label>
                    <input type="number" step="0.01" id="exchangeComm" value="0.7">
                </div>
                <div class="input-group">
                    <label>Обменник (%)</label>
                    <input type="number" step="0.01" id="exchangerComm" value="0.1">
                </div>
                <div class="input-group">
                    <label>Банк (₽)</label>
                    <input type="number" step="1" id="bankComm" value="3000">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="taxToggle" checked>
                <label for="taxToggle">Учитывать налог 13%</label>
            </div>

            <button class="btn-primary" onclick="finishCircle()">✅ Завершить круг</button>
            <button class="btn-warning" onclick="transferCircle()">⏭ Перенести на завтра</button>
            <button class="btn-danger" onclick="finishDay()">🏁 Завершить день</button>
        </div>

        <div id="nextSection" style="display:none;">
            <button class="btn-success" onclick="resetForNextCircle()" id="nextBtn">▶️ Начать следующий круг</button>
            <button class="btn-secondary" onclick="showPeriodSelector()">📊 Выгрузить отчёт</button>
            <button class="btn-danger" onclick="finishDay()">🏁 Завершить день</button>
        </div>

        <div id="results" class="results"></div>
    </div>    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let state = {
            lastActiveDate: null,
            currentCircle: 1,
            circleInProgress: false,
            isCurrentCircleTransferred: false,
            pendingTransfer: null,
            lastFinishedCircle: null,
            dayClosed: false
        };

        const TAX_PCT = 13; // фиксированный налог

        // --- Утилиты ---
        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function dateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function formatDateTime(dateString) {
            if (!dateString) return '—';
            return new Date(dateString).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        function formatDateOnly(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function formatDateForFile(dateString) {
            return new Date(dateString).toLocaleDateString('ru-RU').replace(/\./g, '-');
        }
        function calculateDuration(startStr, endStr) {
            if (!startStr || !endStr) return '—';
            const diffMs = new Date(endStr) - new Date(startStr);
            if (diffMs < 0) return 'Ошибка времени';
            const h = Math.floor(diffMs / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);
            return h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
        }
        function nowLocalISO() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return (new Date(now - offset)).toISOString().slice(0, 16);
        }

        function saveState() { localStorage.setItem('arbitrageState', JSON.stringify(state)); }
        function loadState() {
            const saved = localStorage.getItem('arbitrageState');
            if (saved) { try { state = JSON.parse(saved); } catch(e) {} }
        }
        function getHistory() { return JSON.parse(localStorage.getItem('arbitrageHistory') || '[]'); }
        function saveHistory(h) { localStorage.setItem('arbitrageHistory', JSON.stringify(h)); }

        function getPayouts() { return JSON.parse(localStorage.getItem('arbitragePayouts') || '{}'); }
        function savePayouts(p) { localStorage.setItem('arbitragePayouts', JSON.stringify(p)); }

        // --- Инициализация ---
        function init() {
            loadState();
            const today = todayStr();
            if (state.lastActiveDate && state.lastActiveDate !== today) {
                handleNewDay();
            }
            state.lastActiveDate = today;
            saveState();

            if (state.pendingTransfer) showTransferNotice(state.pendingTransfer);
            updateUI();
            renderTodayCircles();
        }

        function handleNewDay() {
            if (state.pendingTransfer) {
                state.currentCircle = state.pendingTransfer.circleNumber;
            } else {
                state.currentCircle = 1;
            }
            state.circleInProgress = false;
            state.lastFinishedCircle = null;
            state.dayClosed = false;
        }

        function showTransferNotice(pt) {
            document.getElementById('transferCircleNum').innerText = pt.circleNumber;
            document.getElementById('transferDate').innerText = formatDateOnly(pt.fromDate);
            document.getElementById('transferNotice').style.display = 'block';
        }

        function updateUI() {
            const startSection = document.getElementById('startSection');
            const formSection = document.getElementById('formSection');
            const nextSection = document.getElementById('nextSection');

            document.getElementById('currentCircleNum').innerText = state.currentCircle;

            if (state.circleInProgress) {
                startSection.style.display = 'none';
                formSection.style.display = 'block';
                nextSection.style.display = 'none';
            } else {
                startSection.style.display = 'block';
                formSection.style.display = 'none';
                nextSection.style.display = 'none';
                document.getElementById('startBtn').innerText = `▶️ Начать ${state.currentCircle}-й круг`;
            }
        }

        // --- Старт круга ---
        function startCircle() {
            state.circleInProgress = true;
            saveState();

            const startInput = document.getElementById('startTime');
            const endInput = document.getElementById('endTime');

            if (state.pendingTransfer) {
                const pt = state.pendingTransfer;
                document.getElementById('amount').value = pt.amount;
                document.getElementById('buyPrice').value = pt.buyPrice;
                document.getElementById('sellPrice').value = pt.sellPrice;
                document.getElementById('exchangeComm').value = pt.exchangeComm;
                document.getElementById('exchangerComm').value = pt.exchangerComm;
                document.getElementById('bankComm').value = pt.bankComm;
                document.getElementById('taxToggle').checked = pt.taxEnabled;
                startInput.value = pt.startTime;
                state.isCurrentCircleTransferred = true;
                document.getElementById('transferNotice').style.display = 'none';
                state.pendingTransfer = null;
                saveState();
                tg.showAlert(`Продолжаем круг №${state.currentCircle}. Время начала сохранено со вчера.`);
            } else {
                startInput.value = nowLocalISO();
                state.isCurrentCircleTransferred = false;
                saveState();
            }
            endInput.value = '';
            tg.HapticFeedback.impactOccurred('light');
            updateUI();
        }

        // --- Завершение круга ---
        function finishCircle() {
            document.getElementById('endTime').value = nowLocalISO();

            const amount = parseFloat(document.getElementById('amount').value);
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const exchangeCommPct = parseFloat(document.getElementById('exchangeComm').value) / 100;
            const exchangerCommPct = parseFloat(document.getElementById('exchangerComm').value) / 100;
            const bankCommRub = parseFloat(document.getElementById('bankComm').value);
            const circleNumber = state.currentCircle;
            const taxEnabled = document.getElementById('taxToggle').checked;
            const startTimeVal = document.getElementById('startTime').value;
            const endTimeVal = document.getElementById('endTime').value;
            const wasTransferred = state.isCurrentCircleTransferred;

            if (isNaN(amount) || isNaN(buyPrice) || isNaN(sellPrice) || isNaN(bankCommRub)) {
                tg.showAlert("Заполните все поля корректными числами!");
                return;
            }
            if (!startTimeVal) {
                tg.showAlert("Укажите время начала круга.");
                return;
            }

            const spreadPct = (sellPrice - buyPrice) / buyPrice;
            const grossProfit = amount * spreadPct;
            const exchangeComm = amount * exchangeCommPct;
            const exchangerComm = (amount - exchangeComm) * exchangerCommPct;
            const totalExpenses = exchangeComm + exchangerComm + bankCommRub;
            const preTaxProfit = grossProfit - totalExpenses;
            const tax = taxEnabled ? preTaxProfit * (TAX_PCT / 100) : 0;
            const netProfit = preTaxProfit - tax;
            const durationStr = calculateDuration(startTimeVal, endTimeVal);

            const history = getHistory();
            history.push({
                date: state.lastActiveDate,
                circle: circleNumber,
                start: startTimeVal,
                end: endTimeVal,
                duration: durationStr,
                amount: amount,
                netProfit: netProfit,
                transferred: wasTransferred,
                tax: tax,
                taxPct: taxEnabled ? TAX_PCT : 0,
                grossProfit: grossProfit,
                expenses: totalExpenses,
                exchangeComm: exchangeComm,
                exchangerComm: exchangerComm,
                bankCommRub: bankCommRub,
                teamPayout: 0
            });
            saveHistory(history);

            state.circleInProgress = false;
            state.lastFinishedCircle = circleNumber;
            let alertMsg = '';
            if (wasTransferred) {
                state.currentCircle = 1;
                state.isCurrentCircleTransferred = false;
                alertMsg = `Перенесённый круг №${circleNumber} завершён. Следующий круг — №1 (новый день).`;
            } else if (state.currentCircle >= 4) {
                state.currentCircle = 1;
                alertMsg = "Все 4 круга завершены! Следующий круг начнётся с 1-го.";
            } else {
                state.currentCircle += 1;
            }
            saveState();
            if (alertMsg) tg.showAlert(alertMsg);

            document.getElementById('nextBtn').innerText = `▶️ Начать ${state.currentCircle}-й круг`;
            document.getElementById('nextSection').style.display = 'block';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'none';

            renderTodayCircles();

            tg.HapticFeedback.notificationOccurred('success');
        }

        // --- Перенос круга ---
        function transferCircle() {
            const amount = parseFloat(document.getElementById('amount').value);
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const exchangeComm = parseFloat(document.getElementById('exchangeComm').value);
            const exchangerComm = parseFloat(document.getElementById('exchangerComm').value);
            const bankComm = parseFloat(document.getElementById('bankComm').value);
            const taxEnabled = document.getElementById('taxToggle').checked;
            const startTime = document.getElementById('startTime').value || nowLocalISO();

            state.pendingTransfer = {
                startTime, circleNumber: state.currentCircle,
                fromDate: state.lastActiveDate,
                amount, buyPrice, sellPrice,
                exchangeComm, exchangerComm, bankComm,
                taxEnabled
            };
            state.circleInProgress = false;
            saveState();

            tg.showAlert(`Круг №${state.currentCircle} перенесён на завтра.`);
            tg.HapticFeedback.notificationOccurred('warning');

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
            updateUI();
        }

        function resetForNextCircle() {
            document.getElementById('nextSection').style.display = 'none';
            startCircle();
        }

        function backToMain() {
            document.getElementById('results').innerHTML = '';
            updateUI();
        }

        // ============================================================
        // 📋 ВЕРХНИЙ БЛОК: мини-статистика + круги от 1-го к последнему
        // ============================================================
        function renderTodayCircles() {
            const topBox = document.getElementById('topCircles');
            const topDivider = document.getElementById('topDivider');

            const payouts = getPayouts();
            const dayClosed = !!payouts[state.lastActiveDate];
            if (dayClosed) {
                topBox.innerHTML = '';
                topDivider.style.display = 'none';
                return;
            }

            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            if (history.length === 0) {
                topBox.innerHTML = '';
                topDivider.style.display = 'none';
                return;
            }

            topDivider.style.display = 'block';

            const sorted = history.slice().sort((a, b) => a.circle - b.circle);

            let totalNet = 0;
            sorted.forEach(h => { totalNet += h.netProfit || 0; });

            let html = `
                <div class="stats-mini">
                    <div>
                        <div class="sm-label">📅 Кругов: <b>${sorted.length}</b> · Прибыль до выплат</div>
                    </div>
                    <div class="sm-value">${totalNet.toLocaleString('ru-RU')} ₽</div>
                </div>
            `;

            sorted.forEach((h) => {
                const mark = h.transferred ? ' ⏭' : '';
                const isLast = h.circle === state.lastFinishedCircle;
                const openAttr = isLast ? 'open' : '';

                html += `
                    <details class="circle-item" ${openAttr}>
                        <summary class="circle-summary">
                            <div class="cs-left">
                                <span class="cs-arrow">▶</span>
                                <span class="cs-title">Круг №${h.circle}${mark}</span>
                                <span class="cs-amount">${(h.amount || 0).toLocaleString('ru-RU')} ₽</span>
                            </div>
                            <span class="cs-profit">${(h.netProfit || 0).toLocaleString('ru-RU')} ₽</span>
                        </summary>
                        <div class="circle-details">
                            <div class="time-row"><span>Начало:</span> <span>${formatDateTime(h.start)}</span></div>
                            <div class="time-row"><span>Окончание:</span> <span>${formatDateTime(h.end)}</span></div>
                            <div class="time-row" style="margin-bottom:8px;"><span>Длительность:</span> <span>${h.duration}</span></div>

                            <div class="result-row"><span>Сумма оборота:</span> <span>${(h.amount || 0).toLocaleString('ru-RU')} ₽</span></div>
                            <div class="result-row"><span>Валовая прибыль:</span> <span>${(h.grossProfit || 0).toLocaleString('ru-RU')} ₽</span></div>

                            <div style="margin-top:6px; font-size:11px; color:var(--hint-color);">Расходы:</div>
                            <div class="result-row" style="font-size:12px;"><span>Биржа:</span> <span>-${(h.exchangeComm || 0).toLocaleString('ru-RU')} ₽</span></div>
                            <div class="result-row" style="font-size:12px;"><span>Обменник:</span> <span>-${(h.exchangerComm || 0).toLocaleString('ru-RU')} ₽</span></div>
                            <div class="result-row" style="font-size:12px;"><span>Банк:</span> <span>-${(h.bankCommRub || 0).toLocaleString('ru-RU')} ₽</span></div>
                            <div class="result-row" style="font-size:12px; font-weight:bold;"><span>Итого расходов:</span> <span style="color:var(--danger-color);">-${(h.expenses || 0).toLocaleString('ru-RU')} ₽</span></div>

                            <div class="result-row" style="margin-top:6px;"><span>Налог 13%:</span> <span style="color:var(--danger-color);">-${(h.tax || 0).toLocaleString('ru-RU')} ₽</span></div>

                            <div class="result-row" style="font-size:15px; margin-top:10px; border-top:2px solid var(--button-color); padding-top:8px;">
                                <span>ЧИСТАЯ ПРИБЫЛЬ КРУГА:</span>
                                <span class="highlight">${(h.netProfit || 0).toLocaleString('ru-RU')} ₽</span>
                            </div>
                        </div>
                    </details>
                `;
            });

            topBox.innerHTML = html;
        }

        // ============================================================
        // 🏁 ЗАВЕРШИТЬ ДЕНЬ
        // ============================================================
        function finishDay() {
            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            if (history.length === 0) {
                tg.showAlert("За сегодня нет завершённых кругов.");
                return;
            }

            const alreadyClosed = getPayouts()[state.lastActiveDate];
            if (alreadyClosed) {
                showDayFinalStats(alreadyClosed.percent, alreadyClosed.amount);
                return;
            }

            let totalNet = 0;
            history.forEach(h => { totalNet += h.netProfit || 0; });

            const defaultPct = 15;

            let html = `
                <div class="payout-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">🏁 Завершение дня</span>
                    </div>
                    <div class="payout-total">
                        <span class="pt-label">Общая чистая прибыль за день</span>
                        <span class="pt-value">${totalNet.toLocaleString('ru-RU')} ₽</span>
                    </div>

                    <div class="payout-row">
                        <span>👥 Процент команде:</span>
                        <input type="number" id="payoutPctInput" value="${defaultPct}" step="0.1" min="0" max="100" oninput="updatePayoutPreview(${totalNet})">
                    </div>

                    <div class="payout-split" id="payoutPreview"></div>

                    <button class="btn-primary" onclick="confirmFinishDay(${totalNet})">✅ Подтвердить и закрыть день</button>
                    <button class="btn-secondary" onclick="backToMain()">← Отмена</button>
                </div>
            `;

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            updatePayoutPreview(totalNet);
        }

        function updatePayoutPreview(totalNet) {
            const pct = parseFloat(document.getElementById('payoutPctInput').value) || 0;
            const teamAmount = totalNet * (pct / 100);
            const remainder = totalNet - teamAmount;

            document.getElementById('payoutPreview').innerHTML = `
                <div class="result-row">
                    <span>Команде (${pct}%):</span>
                    <span style="color:var(--danger-color); font-weight:bold;">−${teamAmount.toLocaleString('ru-RU')} ₽</span>
                </div>
                <div class="result-row" style="border-top:1px dashed var(--hint-color); padding-top:6px; margin-top:6px;">
                    <span>Остаётся нам:</span>
                    <span class="highlight">${remainder.toLocaleString('ru-RU')} ₽</span>
                </div>
            `;
        }

        function confirmFinishDay(totalNet) {
            const pct = parseFloat(document.getElementById('payoutPctInput').value);
            if (isNaN(pct) || pct < 0 || pct > 100) {
                tg.showAlert("Введите корректный процент (0–100).");
                return;
            }
            const teamAmount = totalNet * (pct / 100);

            const payouts = getPayouts();
            payouts[state.lastActiveDate] = {
                percent: pct,
                amount: teamAmount,
                baseProfit: totalNet,
                closedAt: new Date().toISOString()
            };
            savePayouts(payouts);

            const history = getHistory();
            const dayCircles = history.filter(h => h.date === state.lastActiveDate);
            const totalDayNet = dayCircles.reduce((s, h) => s + (h.netProfit || 0), 0);
            if (totalDayNet > 0) {
                history.forEach(h => {
                    if (h.date === state.lastActiveDate) {
                        h.teamPayout = (h.netProfit / totalDayNet) * teamAmount;
                    }
                });
                saveHistory(history);
            }

            state.dayClosed = true;
            state.circleInProgress = false;
            state.currentCircle = 1;
            state.isCurrentCircleTransferred = false;
            state.pendingTransfer = null;
            state.lastFinishedCircle = null;
            saveState();

            document.getElementById('topCircles').innerHTML = '';
            document.getElementById('topDivider').style.display = 'none';

            showDayFinalStats(pct, teamAmount);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function showDayFinalStats(pct, teamAmount) {
            const history = getHistory().filter(h => h.date === state.lastActiveDate);
            const today = formatDateOnly(state.lastActiveDate);

            let totalNet = 0, totalTurnover = 0, totalTax = 0, totalExpenses = 0, totalGross = 0;
            history.forEach(h => {
                totalNet += h.netProfit || 0;
                totalTurnover += h.amount || 0;
                totalTax += h.tax || 0;
                totalExpenses += h.expenses || 0;
                totalGross += h.grossProfit || 0;
            });

            const finalNet = totalNet - teamAmount;

            let html = `
                <div class="result-card" style="border:2px solid var(--success-color);">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">✅ День закрыт — ${today}</span>
                    </div>

                    <div class="result-row"><span>Кругов завершено:</span> <b>${history.length}</b></div>
                    <div class="result-row"><span>Общий оборот:</span> <b>${totalTurnover.toLocaleString('ru-RU')} ₽</b></div>
                    <div class="result-row"><span>Валовая прибыль:</span> <b>${totalGross.toLocaleString('ru-RU')} ₽</b></div>
                    <div class="result-row"><span>Расходы (всего):</span> <b style="color:var(--danger-color);">−${totalExpenses.toLocaleString('ru-RU')} ₽</b></div>
                    <div class="result-row"><span>Налог (всего):</span> <b style="color:var(--danger-color);">−${totalTax.toLocaleString('ru-RU')} ₽</b></div>
                    <div class="result-row" style="border-top:1px dashed var(--hint-color); padding-top:6px; margin-top:6px;">
                        <span>Прибыль до выплат команде:</span>
                        <b>${totalNet.toLocaleString('ru-RU')} ₽</b>
                    </div>
                    <div class="result-row">
                        <span>👥 Команде (${pct}%):</span>
                        <b style="color:var(--danger-color);">−${teamAmount.toLocaleString('ru-RU')} ₽</b>
                    </div>
                    <div class="result-row" style="font-size:17px; border-top:2px solid var(--success-color); padding-top:10px; margin-top:10px;">
                        <span>💰 ЧИСТАЯ ПРИБЫЛЬ ДНЯ:</span>
                        <span class="highlight">${finalNet.toLocaleString('ru-RU')} ₽</span>
                    </div>

                    <button class="btn-success" onclick="startNewDayAfterClose()">▶️ Начать новый день</button>
                    <button class="btn-secondary" onclick="backToMain()">← На главную</button>
                </div>
            `;

            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function startNewDayAfterClose() {
            state.circleInProgress = false;
            state.currentCircle = 1;
            state.dayClosed = false;
            state.lastFinishedCircle = null;
            saveState();

            document.getElementById('results').innerHTML = '';
            document.getElementById('topCircles').innerHTML = '';
            document.getElementById('topDivider').style.display = 'none';
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
            document.getElementById('nextSection').style.display = 'none';
            document.getElementById('transferNotice').style.display = 'none';

            updateUI();
            renderTodayCircles();
        }

        // ============================================================
        // 📊 ВЫБОР ПЕРИОДА И ОТЧЁТ
        // ============================================================
        function showPeriodSelector(defaultFrom, defaultTo) {
            const today = todayStr();
            const from = defaultFrom || today;
            const to = defaultTo || today;

            let html = `
                <div class="result-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">📊 Выгрузка отчёта</span>
                    </div>

                    <div style="font-size:11px; color:var(--hint-color); margin-bottom:6px;">Быстрый выбор:</div>
                    <div class="quick-periods">
                        <button class="btn-secondary btn-small" onclick="setPeriod('today')">Сегодня</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('yesterday')">Вчера</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('7d')">7 дней</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('30d')">30 дней</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('month')">Этот месяц</button>
                        <button class="btn-secondary btn-small" onclick="setPeriod('all')">Всё время</button>
                    </div>

                    <div class="section-title">Или выберите вручную</div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Дата с</label>
                            <input type="date" id="periodFrom" value="${from}">
                        </div>
                        <div class="input-group">
                            <label>Дата по</label>
                            <input type="date" id="periodTo" value="${to}">
                        </div>
                    </div>

                    <button class="btn-primary" onclick="buildAndShowReport()">📊 Построить отчёт</button>
                    <button class="btn-secondary" onclick="backToMain()">← Назад</button>
                </div>
            `;
            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function setPeriod(preset) {
            const now = new Date();
            const today = dateStr(now);
            let from = today, to = today;

            switch (preset) {
                case 'today': from = today; to = today; break;
                case 'yesterday': {
                    const y = new Date(now); y.setDate(y.getDate() - 1);
                    from = dateStr(y); to = dateStr(y); break;
                }
                case '7d': {
                    const f = new Date(now); f.setDate(f.getDate() - 6);
                    from = dateStr(f); to = today; break;
                }
                case '30d': {
                    const f = new Date(now); f.setDate(f.getDate() - 29);
                    from = dateStr(f); to = today; break;
                }
                case 'month': {
                    const f = new Date(now.getFullYear(), now.getMonth(), 1);
                    from = dateStr(f); to = today; break;
                }
                case 'all': {
                    const history = getHistory();
                    if (history.length === 0) { from = today; to = today; }
                    else {
                        const dates = history.map(h => h.date).sort();
                        from = dates[0]; to = today;
                    }
                    break;
                }
            }

            document.getElementById('periodFrom').value = from;
            document.getElementById('periodTo').value = to;
            buildAndShowReport();
        }

        function buildReport(fromDate, toDate) {
            const history = getHistory().filter(h => h.date >= fromDate && h.date <= toDate);
            const payouts = getPayouts();

            const fromFmt = formatDateOnly(fromDate);
            const toFmt = formatDateOnly(toDate);
            const periodLabel = fromDate === toDate ? fromFmt : `${fromFmt} — ${toFmt}`;

            if (history.length === 0) {
                return `📅 ОТЧЁТ ЗА ПЕРИОД\n${periodLabel}\n\nНет завершённых кругов за выбранный период.`;
            }

            const byDay = {};
            history.forEach(h => {
                if (!byDay[h.date]) byDay[h.date] = [];
                byDay[h.date].push(h);
            });

            const sortedDays = Object.keys(byDay).sort();
            let lines = [`📅 ОТЧЁТ ЗА ПЕРИОД`, `${periodLabel}`, '━━━━━━━━━━━━━━━━━━━━', ''];

            let grandTotal = { circles: 0, net: 0, team: 0, amount: 0, final: 0 };

            sortedDays.forEach(day => {
                const dayEntries = byDay[day].sort((a,b) => a.circle - b.circle);
                const dayTotal = { circles: 0, net: 0, amount: 0 };

                lines.push(`📆 ${formatDateOnly(day)}`);

                dayEntries.forEach(h => {
                    const mark = h.transferred ? ' ⏭' : '';
                    lines.push(`  🔄 Круг №${h.circle}${mark}`);
                    lines.push(`     ${formatDateTime(h.start)} — ${formatDateTime(h.end)} (${h.duration})`);
                    lines.push(`     Сумма: ${(h.amount || 0).toLocaleString('ru-RU')} ₽`);
                    lines.push(`     Чистая прибыль: ${(h.netProfit || 0).toLocaleString('ru-RU')} ₽`);

                    dayTotal.circles++;
                    dayTotal.net += h.netProfit || 0;
                    dayTotal.amount += h.amount || 0;
                });

                const dayPayout = payouts[day];
                const dayFinal = dayPayout ? (dayTotal.net - dayPayout.amount) : dayTotal.net;

                lines.push(`  ─── Итого за день: ${dayTotal.net.toLocaleString('ru-RU')} ₽ (${dayTotal.circles} кр.)`);
                if (dayPayout) {
                    lines.push(`      👥 Команде (${dayPayout.percent}%): −${dayPayout.amount.toLocaleString('ru-RU')} ₽`);
                    lines.push(`      💰 ЧИСТАЯ ПРИБЫЛЬ ДНЯ: ${dayFinal.toLocaleString('ru-RU')} ₽`);
                } else {
                    lines.push(`      ⚠️ День не закрыт (выплата команде не применялась)`);
                }
                lines.push('');

                grandTotal.circles += dayTotal.circles;
                grandTotal.net += dayTotal.net;
                grandTotal.team += dayPayout ? dayPayout.amount : 0;
                grandTotal.amount += dayTotal.amount;
                grandTotal.final += dayFinal;
            });

            lines.push('━━━━━━━━━━━━━━━━━━━━');
            lines.push(`📊 ИТОГО ЗА ПЕРИОД:`);
            lines.push(`Дней в отчёте: ${sortedDays.length}`);
            lines.push(`Кругов завершено: ${grandTotal.circles}`);
            lines.push(`Общий оборот: ${grandTotal.amount.toLocaleString('ru-RU')} ₽`);
            lines.push(`Прибыль до выплат: ${grandTotal.net.toLocaleString('ru-RU')} ₽`);
            lines.push(`Выплаты команде: −${grandTotal.team.toLocaleString('ru-RU')} ₽`);
            lines.push(`💰 ЧИСТАЯ ПРИБЫЛЬ: ${grandTotal.final.toLocaleString('ru-RU')} ₽`);

            return lines.join('\n');
        }

        function buildAndShowReport() {
            const fromDate = document.getElementById('periodFrom').value;
            const toDate = document.getElementById('periodTo').value;

            if (!fromDate || !toDate) {
                tg.showAlert("Укажите обе даты периода.");
                return;
            }
            if (fromDate > toDate) {
                tg.showAlert("Дата «с» не может быть позже даты «по».");
                return;
            }

            const reportText = buildReport(fromDate, toDate);
            window.__lastReport = reportText;
            window.__reportPeriod = { from: fromDate, to: toDate };

            const safeText = reportText.replace(/</g, '&lt;');
            let html = `
                <div class="result-card">
                    <div style="text-align:center; margin-bottom:10px;">
                        <span class="badge badge-day">📅 Отчёт за период</span>
                    </div>
                    <div class="report-text">${safeText}</div>
                    <button class="btn-primary" onclick="downloadReport()">📥 Скачать TXT</button>
                    <button class="btn-secondary" onclick="copyReport()">📋 Скопировать</button>
                    <button class="btn-success" onclick="sendReportToChat()">📤 Отправить в чат</button>
                    <button class="btn-secondary" onclick="showPeriodSelector('${fromDate}', '${toDate}')">← Изменить период</button>
                    <button class="btn-secondary" onclick="backToMain()">🏠 На главную</button>
                </div>
            `;
            document.getElementById('results').innerHTML = html;
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function downloadReport() {
            const text = window.__lastReport || '';
            const period = window.__reportPeriod || { from: todayStr(), to: todayStr() };
            const nameFrom = formatDateForFile(period.from);
            const nameTo = formatDateForFile(period.to);
            const filename = period.from === period.to
                ? `arbitrage_${nameFrom}.txt`
                : `arbitrage_${nameFrom}_${nameTo}.txt`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function copyReport() {
            const text = window.__lastReport || '';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    tg.showAlert("Отчёт скопирован ✅");
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                tg.showAlert("Отчёт скопирован ✅");
            }
        }

        function sendReportToChat() {
            const text = window.__lastReport || '';
            const period = window.__reportPeriod || { from: todayStr(), to: todayStr() };
            try {
                tg.sendData(JSON.stringify({
                    type: 'period_report',
                    from: period.from,
                    to: period.to,
                    text: text
                }));
                tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                tg.showAlert("Отправка доступна только внутри Telegram-бота.");
            }
        }

        // --- Запуск ---
        init();
    </script>
</body>
</html>
